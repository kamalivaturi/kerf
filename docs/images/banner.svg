<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">Kerf</title>
  <desc id="d">Kerf: cut the busywork, not the edit. A free, open-source editing toolkit for Premiere Pro, After Effects and DaVinci Resolve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1817"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ff6b2c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="338" rx="21" fill="none" stroke="#403a36" stroke-width="2"/>
  <g transform="translate(78 218) skewX(-12)" font-family="'Arial Black','Segoe UI Black',Arial,Helvetica,sans-serif" font-weight="900" font-size="170" letter-spacing="-8">
    <text x="0" y="6" fill="#b8400f">kerf</text>
    <text x="0" y="0" fill="#ff6b2c">kerf</text>
  </g>
  <g font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <text x="520" y="150" font-size="44" font-weight="800" fill="#f3ece7">Cut the busywork, not the edit.</text>
    <text x="520" y="196" font-size="23" fill="#d6cdc6">Silences, captions, speed ramps, shakes and more.</text>
    <text x="520" y="232" font-size="23" fill="#a59a92">Free and open source for Premiere Pro, After Effects and Resolve.</text>
  </g>
  <rect x="520" y="262" width="96" height="6" rx="3" fill="#ff6b2c"/>
</svg>
