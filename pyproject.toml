[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerf"
version = "0.2.3"
description = "Free, open-source AI editing toolkit for Premiere Pro, After Effects and DaVinci Resolve"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "faster-whisper>=1.0", "opencv-python>=4.8", "onnxruntime>=1.17", "yt-dlp>=2026.8.19"]

[project.optional-dependencies]
ai = ["anthropic>=0.76", "openai>=2.0", "google-genai>=1.0"]
indic = ["indic-transliteration>=2.3"]
dev = ["pytest>=8", "pyinstaller>=6.16"]

[project.scripts]
kerf = "kerf.__main__:main"

[tool.setuptools]
packages = ["kerf"]
