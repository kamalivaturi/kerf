name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) curl -sSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
                     unzip -q ff.zip -d "$RUNNER_TEMP/ff" && cygpath -w "$(ls -d "$RUNNER_TEMP"/ff/*/bin)" >> "$GITHUB_PATH" ;;
          esac
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck && npm run build
        working-directory: ui

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: mkdir -p engine-dist/kerf-engine   # tauri-build checks that bundled resources exist
        shell: bash
      - run: cargo check
        working-directory: desktop/src-tauri

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp aftereffects/Kerf.jsx /tmp/k.js && node --check /tmp/k.js
      - run: python3 -c "import ast; ast.parse(open('resolve/Kerf.py').read())"
      - run: sh -n install/install.sh && sh -n start-kerf.sh && sh -n start-kerf.command
