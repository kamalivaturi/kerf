name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:  # Kerf installers (engine + editor panels) + portable engine, per OS
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2
      - name: Build the panel / web UI
        run: npm ci && npm run build
        working-directory: ui
      - name: Bundle the editor panels the installer puts in place
        run: python scripts/build_panels.py
      - name: Kerf FX for DaVinci Resolve (OpenFX), checked in a stand-in OFX host
        run: python scripts/build_ofx.py && { if [ "$(uname -sm)" = "Darwin arm64" ]; then arch -x86_64 /usr/bin/python3 tests/ofx_host_test.py; else python tests/ofx_host_test.py; fi; }
      - name: Sign the After Effects panel on its own platform (self-signed, so it loads without CEP debug mode)
        if: runner.os != 'Linux'
        run: |
          base=https://github.com/Adobe-CEP/CEP-Resources/raw/master/ZXPSignCMD/4.1.3
          if [ "$RUNNER_OS" = Windows ]; then Z=./ZXPSignCmd.exe; curl -sfL -o $Z "$base/x64/ZXPSignCmd.exe"
          else Z=./ZXPSignCmd; curl -sfL -o $Z "$base/macOS/ZXPSignCmd"; chmod +x $Z; fi
          $Z -selfSignedCert US CA Kerf Kerf "$GITHUB_RUN_ID" kerf-cep.p12 -validityDays 3650
          $Z -sign build/panels/com.kerf.aftereffects kerf-ae.zxp kerf-cep.p12 "$GITHUB_RUN_ID"
          rm -rf build/panels/com.kerf.aftereffects && mkdir build/panels/com.kerf.aftereffects
          (cd build/panels/com.kerf.aftereffects && unzip -q ../../../kerf-ae.zxp)
          ls build/panels/com.kerf.aftereffects/META-INF
      - name: Freeze the engine (static ffmpeg included)
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          pip install -e ".[ai,dev]"
          python scripts/build_engine.py --download
      - name: Smoke-test the frozen engine
        run: |
          E=engine-dist/kerf-engine/kerf-engine; [ -f "$E.exe" ] && E="$E.exe"
          "$E" --version
          "$E" check
          "$E" serve --port 7899 > engine-smoke.log 2>&1 & PID=$!
          ok=0; for i in $(seq 1 60); do curl -sf http://127.0.0.1:7899/health && ok=1 && break; sleep 2; done
          [ $ok = 1 ] || { cat engine-smoke.log; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7899/app/)" = 404 ]  # no browser app since 0.3
          kill $PID 2>/dev/null || true
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM kerf-engine.exe || true; fi
      - name: Portable archive
        run: python scripts/build_release.py --portable ${{ matrix.name }}
      - name: Pack the engine for Linux bundles (one archive, unpacked on first launch)
        if: runner.os == 'Linux'
        run: tar -czf engine-dist/kerf-engine.tar.gz -C engine-dist kerf-engine
      - name: Desktop installers (Tauri)
        run: npm ci && npx tauri build ${{ runner.os == 'Linux' && '--verbose' || '' }}
        working-directory: desktop
        env:
          NO_STRIP: "true"                # linuxdeploy's old strip chokes on the frozen engine's modern ELF libs
          APPIMAGE_EXTRACT_AND_RUN: "1"   # run linuxdeploy without FUSE
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}            # signs the auto-update packages
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: python scripts/build_release.py --collect-desktop ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  packages:  # host plugins: .ccx, AE panel, source zip, wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: ui
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: release/*

  publish:
    needs: [desktop, packages]
    if: ${{ !cancelled() && needs.packages.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Auto-update feed (latest.json, signed packages)
        run: python3 scripts/build_release.py --updater-manifest ${{ github.repository }}
      - run: python3 scripts/build_release.py --sums
      - name: Release notes (this version's CHANGELOG section)
        run: awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md
