name: Kerf FX (OpenFX)
on:
  push:
    branches: [main]
    paths: ["ofx/**", "scripts/build_ofx.py", "tests/ofx_host_test.py", ".github/workflows/ofx.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_ofx.py
      - name: Render every effect in a stand-in OFX host (Apple silicon tests the x86_64 slice under Rosetta)
        shell: bash
        run: if [ "$(uname -sm)" = "Darwin arm64" ]; then arch -x86_64 /usr/bin/python3 tests/ofx_host_test.py; else python tests/ofx_host_test.py; fi
      - uses: actions/upload-artifact@v4
        with:
          name: KerfFX-${{ runner.os }}
          path: build/panels/KerfFX.ofx.bundle
