[package]
name = "kerf-studio"
version = "0.2.0"
description = "Kerf Studio: AI editing toolkit for Premiere Pro, After Effects and DaVinci Resolve"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
